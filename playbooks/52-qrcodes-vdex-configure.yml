# Playbook: 52-qrcodes-vdex-configure.yml
# Purpose: Write config.js for the qrcodes app with vDEX RPC credentials.
#          config.js is baked into the Docker image at build time.
# Run with: ansible-playbook -i inventory.ini playbooks/52-qrcodes-vdex-configure.yml
# Requires: 50-qrcodes-vdex-clone.yml (repo cloned)
#           AND 51-fetch-vdex-signer-wif.yml (WIF file written)
# Idempotent: safe to re-run — overwrites config.js each time.
# Next: run 53-qrcodes-vdex-build.yml
---
- name: Configure qrcodes app for vDEX
  hosts: production
  become: false
  vars:
    qr_repo_dest: "verus-identity-update-qr-creator-vdex"
    qr_path: "/home/{{ ansible_user }}/{{ qr_repo_dest }}"
    vdex_data_dir: "/home/dream-hermes-agent/docker-verusd/pbaas/vdex/data_dir"
    vdex_conf_name: "53fe39eea8c06bba32f1a4e20db67e5524f0309d.conf"
    # vDEX chain params
    vdex_rpc_host: "10.203.0.11"
    vdex_rpc_port: "21778"
    # Separate WIF file from VRSCTEST
    signer_wif_file: "/home/{{ ansible_user }}/.bwd_signer_wif_vdex"

  tasks:
    # ── 1. Verify repo is cloned ─────────────────────────────────────────────────
    - name: Verify vDEX qrcode repository exists
      ansible.builtin.stat:
        path: "{{ qr_path }}"
      register: qr_dir_stat
      failed_when: not qr_dir_stat.stat.exists

    # ── 2. Read vDEX .conf ────────────────────────────────────────────────────
    - name: Slurp vDEX chain conf
      ansible.builtin.slurp:
        src: "{{ vdex_data_dir }}/{{ vdex_conf_name }}"
      register: vdex_conf_b64
      failed_when: false

    - name: Fail if vDEX conf not found
      ansible.builtin.fail:
        msg: |
          vDEX conf not found at {{ vdex_data_dir }}/{{ vdex_conf_name }}.
          Start vDEX first: ansible-playbook -i inventory.ini playbooks/13-start-pbaas.yml -e pbaas_chain=vdex
      when: vdex_conf_b64.failed | default(false)

    # ── 3. Extract RPC credentials ──────────────────────────────────────────────
    - name: Extract rpcuser from vDEX conf
      ansible.builtin.set_fact:
        vdex_rpcuser: "{{ vdex_conf_b64.content | b64decode | regex_findall('^rpcuser=(.+)$', multiline=True) | first | trim }}"

    - name: Extract rpcpassword from vDEX conf
      ansible.builtin.set_fact:
        vdex_rpcpassword: "{{ vdex_conf_b64.content | b64decode | regex_findall('^rpcpassword=(.+)$', multiline=True) | first | trim }}"

    - name: Validate RPC credentials extracted
      ansible.builtin.assert:
        that:
          - vdex_rpcuser | length > 0
          - vdex_rpcpassword | length > 0
        fail_msg: "Could not extract rpcuser/rpcpassword from vDEX conf"

    # ── 4. Read SERVICE_SIGNER_WIF from file written by playbook 51 ───────────
    - name: Read signer WIF from remote file via slurp
      ansible.builtin.slurp:
        src: "{{ signer_wif_file }}"
      register: signer_wif_b64
      failed_when: false

    - name: Fail if WIF could not be read
      ansible.builtin.fail:
        msg: |
          Could not read SERVICE_SIGNER_WIF from {{ signer_wif_file }}.
          Run playbook 51-fetch-vdex-signer-wif.yml first.
      when: signer_wif_b64.failed | default(false)

    - name: Set SERVICE_SIGNER_WIF fact
      ansible.builtin.set_fact:
        service_signer_wif: "{{ signer_wif_b64.content | b64decode | trim }}"

    # ── 5. Write config.js ─────────────────────────────────────────────────────
    - name: Write config.js for vDEX
      ansible.builtin.copy:
        content: |
          // config.js — auto-generated by ansible, do not commit
          module.exports = {
            RPC_HOST: "{{ vdex_rpc_host }}",
            RPC_PORT: {{ vdex_rpc_port }},
            RPC_USER: "{{ vdex_rpcuser }}",
            RPC_PASSWORD: "{{ vdex_rpcpassword }}",
            SERVICE_SIGNER_IADDRESS: "{{ bwd_service_signer_iaddress }}",
            SERVICE_SIGNER_WIF: "{{ service_signer_wif }}",
          };
        dest: "{{ qr_path }}/config.js"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      register: config_written

    # ── 6. Write Dockerfile (same as VRSCTEST, no chain-specific logic) ─────────
    - name: Write Dockerfile
      ansible.builtin.copy:
        content: |
          # Stage 1: Build TypeScript
          FROM node:20-alpine AS builder
          WORKDIR /build
          RUN apk add --no-cache git
          COPY package.json yarn.lock .yarnrc.yml ./
          COPY .yarn .yarn/
          COPY .yarnrc.yml ./
          RUN yarn install --immutable || yarn install
          COPY . .
          RUN yarn build

          # Stage 2: Minimal runtime
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache curl
          COPY --from=builder /build/dist ./dist
          COPY --from=builder /build/config.js ./
          COPY --from=builder /build/package.json ./
          COPY --from=builder /build/node_modules ./node_modules
          COPY --from=builder /build/views ./views
          COPY --from=builder /build/public ./public
          EXPOSE 3000
          HEALTHCHECK --interval=30s --timeout=10s --start-period=15s --retries=3 \
            CMD curl -f http://localhost:3000/ || exit 1
          CMD ["node", "dist/server.js"]
        dest: "{{ qr_path }}/Dockerfile"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      register: dockerfile_written

    # ── 7. Summary ─────────────────────────────────────────────────────────────
    - name: Display configuration summary
      ansible.builtin.debug:
        msg: |
          qrcodes configured for vDEX:
            config.js  → {{ qr_path }}/config.js
            Dockerfile → {{ qr_path }}/Dockerfile
            RPC_HOST   → {{ vdex_rpc_host }}
            RPC_PORT   → {{ vdex_rpc_port }}
            RPC_USER   → {{ vdex_rpcuser }}
            RPC_PASSWORD → <redacted>
            SERVICE_SIGNER_IADDRESS → {{ bwd_service_signer_iaddress }}
            SERVICE_SIGNER_WIF       → <read from {{ signer_wif_file }}>

          Next: run 53-qrcodes-vdex-build.yml to build the image
