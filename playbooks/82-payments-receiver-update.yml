# Playbook: 82-payments-receiver-update.yml
# Purpose: App-only update for the payments-receiver stack on BWD.
#          Rebuilds the app image and recreates ONLY the app container,
#          leaving the KDF container and its volume (HD wallet state,
#          enabled coins, mnemonic) untouched.
#
# ⚠️ DO NOT use playbook 81 (deploy) to update a running stack — it tears
#    down both containers and wipes /data/DB + payments.db from the volume,
#    which destroys the KDF HD wallet and all enabled coin activations.
#
# Run with: ansible-playbook -i inventory.ini playbooks/82-payments-receiver-update.yml -e @group_vars/production-local.yml
# Requires: 79 (clone/sync) has been run so the latest source is on BWD.
---
- name: Update payments-receiver app (app-only, preserves wallet volume)
  hosts: production
  become: false
  vars:
    receiver_path: "/home/{{ ansible_user }}/payments-receiver"
    compose_file: "docker-compose.deploy.yml"
    app_image: "buildwithdreams/payments-receiver:latest"
    kdf_static_ip: "{{ payments_receiver_kdf_static_ip }}"

  tasks:
    - name: Verify compose file exists
      ansible.builtin.stat:
        path: "{{ receiver_path }}/{{ compose_file }}"
      register: compose_stat
      failed_when: not compose_stat.stat.exists

    - name: Rebuild app image
      ansible.builtin.shell:
        cmd: "cd {{ receiver_path }} && docker build --target app -t {{ app_image }} . 2>&1"
      register: app_build
      changed_when: "'Successfully built' in app_build.stdout or 'naming to' in app_build.stdout"
      failed_when: app_build.rc != 0

    # Recreate ONLY the app service. --no-deps prevents compose from
    # touching the kdf service; the volume is never recreated.
    - name: Recreate app container (kdf + volume untouched)
      ansible.builtin.shell:
        cmd: "cd {{ receiver_path }} && docker compose --env-file .env -f {{ compose_file }} up -d --no-deps app 2>&1"
      register: up_result
      changed_when: "'Recreated' in up_result.stdout or 'Started' in up_result.stdout"
      failed_when: up_result.rc != 0

    # Probe the app via its static IP — host port 8000 is squatted by
    # another container (vtmarketsapi); 127.0.0.1 would hit the wrong app.
    - name: Wait for app health endpoint on static IP (up to 120s)
      ansible.builtin.shell:
        cmd: >-
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://{{ kdf_static_ip }}:8000/health 2>/dev/null || echo 000);
            if [ "$code" = "200" ]; then echo "healthy after $((i*5))s"; exit 0; fi;
            sleep 5;
          done; echo "app not healthy after 120s"; exit 1
      register: health_result
      changed_when: false
      failed_when: health_result.rc != 0

    - name: Verify /status shows connected coins
      ansible.builtin.shell:
        cmd: "curl -s --max-time 10 http://{{ kdf_static_ip }}:8000/status 2>&1"
      register: status_result
      changed_when: false

    - name: Display /status summary
      ansible.builtin.debug:
        msg: "{{ status_result.stdout | default('(empty response)') }}"

    - name: Verify KDF container untouched
      ansible.builtin.shell:
        cmd: "docker ps --format '{% raw %}{{.Names}}\t{{.Status}}{% endraw %}' 2>&1 | grep payments"
      register: ps_result
      changed_when: false
      failed_when: "'payments-receiver' not in ps_result.stdout"
