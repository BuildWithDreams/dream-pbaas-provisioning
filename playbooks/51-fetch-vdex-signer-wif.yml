# Playbook: 51-fetch-vdex-signer-wif.yml
# Purpose: Fetch the WIF private key for the BWD@ identity's primary address on vDEX.
#          Writes to ~/.bwd_signer_wif_vdex — separate from the VRSCTEST WIF file.
#          SERVICE_SIGNER_WIF is never stored in inventory or code.
#
# NOTE: The BWD@ identity only exists on VRSCTEST, not on vDEX. If no identity
# is found on vDEX, this playbook writes a placeholder WIF so the QRcodes app
# can still be deployed — the SERVICE_SIGNER signing feature will be unavailable
# until a BWD@ identity is registered on vDEX.
#
# To register BWD@ on vDEX: use the idcreate service or register manually first,
# then re-run this playbook and 52 to enable the signing feature.
#
# Run with: ansible-playbook -i inventory.ini playbooks/51-fetch-vdex-signer-wif.yml
#           -e identity_name=BWD@  (optional, defaults to BWD@)
# Requires: vDEX daemon running and synced
# Next: run 52-qrcodes-vdex-configure.yml
---
- name: Fetch SERVICE_SIGNER_WIF from vDEX daemon
  hosts: production
  become: false
  vars:
    identity_name_arg: "{{ identity_name | default('BWD@') }}"
    vdex_chain: "vDEX"
    vdex_container: "mains_blue-vdex-1"
    signer_wif_file: "/home/{{ ansible_user }}/.bwd_signer_wif_vdex"

  tasks:
    # ── 1. Verify vDEX container is running ──────────────────────────────────────
    - name: Verify vDEX container is running
      ansible.builtin.shell:
        cmd: "docker ps 2>/dev/null | grep 'mains_blue-vdex-1' | head -1"
      register: vdex_container_check
      failed_when: false

    - name: Fail if vDEX container is not running
      ansible.builtin.fail:
        msg: |
          vDEX container (mains_blue-vdex-1) is not running.
          Start it first with: ansible-playbook -i inventory.ini playbooks/13-start-pbaas.yml -e pbaas_chain=vdex
      when: vdex_container_check.stdout | length == 0

    # ── 2. Try to get identity primaryaddress from vDEX daemon ──────────────────
    - name: Get primary address from vDEX identity (best-effort)
      ansible.builtin.shell: |
        docker exec {{ vdex_container }} \
          verus -chain={{ vdex_chain }} getidentity {{ identity_name_arg }} 2>&1
      register: identity_output
      failed_when: false

    # ── 3a. Identity found — dump WIF ─────────────────────────────────────────
    - name: Parse primaryaddresses from getidentity JSON
      ansible.builtin.set_fact:
        primary_address: "{{ (identity_output.stdout | from_json).identity.primaryaddresses[0] }}"
      when: identity_output.rc == 0

    - name: Dump WIF private key for primary address
      ansible.builtin.shell: |
        docker exec {{ vdex_container }} \
          verus -chain={{ vdex_chain }} dumpprivkey {{ primary_address }} 2>&1
      register: dumpprivkey_output
      failed_when: false
      when: identity_output.rc == 0

    - name: Set WIF fact from daemon
      ansible.builtin.set_fact:
        service_signer_wif: "{{ dumpprivkey_output.stdout | trim }}"
      when: dumpprivkey_output.rc == 0

    # ── 3b. Identity not found — write placeholder ─────────────────────────────
    - name: Write placeholder WIF (identity not on vDEX)
      ansible.builtin.copy:
        content: |
          NOT_REGISTERED_ON_VDEX
        dest: "{{ signer_wif_file }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      register: wif_placeholder_written
      when: identity_output.rc != 0

    # ── 4. Write WIF to vDEX-specific temp file ────────────────────────────────
    - name: Write WIF to vDEX temp file
      ansible.builtin.copy:
        content: |
          {{ service_signer_wif }}
        dest: "{{ signer_wif_file }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      register: wif_written
      when: identity_output.rc == 0

    # ── 5. Summary ─────────────────────────────────────────────────────────────
    - name: Display fetch result
      ansible.builtin.debug:
        msg: |
          SERVICE_SIGNER_WIF for {{ identity_name }} (vDEX):
            identity    → {{ identity_name }}
            r-address   → {{ primary_address | default('(not found on vDEX)') }}
            WIF file    → {{ signer_wif_file }}
            chain       → {{ vdex_chain }}
            container   → {{ vdex_container }}
            {{ 'WIF written successfully.' if identity_output.rc == 0 else '⚠ Identity not on vDEX — placeholder written. SERVICE_SIGNER feature disabled.' }}

          {{ 'Next: run 52-qrcodes-vdex-configure.yml' if identity_output.rc == 0 else 'Next: run 52-qrcodes-vdex-configure.yml (signing feature will be unavailable until BWD@ is registered on vDEX)' }}
