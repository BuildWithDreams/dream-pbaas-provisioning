# Playbook: 44b-idcreate-source-of-funds-vrsc.yml
# Purpose: Set SOURCE_OF_FUNDS in svc-idcreate .env and force-restart the stack (VRSC mainnet).
# Run with: ansible-playbook -i inventory.ini playbooks/44b-idcreate-source-of-funds-vrsc.yml
#           (optional) -e "source_of_funds_address=RXXXXXXXXXXXXXXXXXXXXXXXX"
#           If no source_of_funds_address is provided, SOURCE_OF_FUNDS is left blank.
---
- name: Set SOURCE_OF_FUNDS for svc-idcreate (VRSC mainnet)
  hosts: production
  become: false
  vars:
    idcreate_path: "{{ idcreate_vrsc_path }}"
    compose_project: "{{ idcreate_vrsc_compose_project }}"

  tasks:
    # ── 1. Validate input (source_of_funds_address is optional) ─────────────────
    - name: Check if source_of_funds_address was provided
      ansible.builtin.set_fact:
        has_source_of_funds: "{{ source_of_funds_address | default('') | length > 0 }}"

    # ── 2. Verify .env exists ─────────────────────────────────────────────────
    - name: Check if .env exists
      ansible.builtin.stat:
        path: "{{ idcreate_path }}/.env"
      register: env_file_stat

    - name: Fail if .env not found
      ansible.builtin.fail:
        msg: |
          .env not found at {{ idcreate_path }}/.env.
          Run playbook 41b-idcreate-deploy-vrsc.yml first to create it.
      when: not env_file_stat.stat.exists

    # ── 3. Write SOURCE_OF_FUNDS to .env (only if provided) ─────────────────────
    - name: Set SOURCE_OF_FUNDS in .env
      ansible.builtin.lineinfile:
        path: "{{ idcreate_path }}/.env"
        regexp: '^SOURCE_OF_FUNDS='
        line: 'SOURCE_OF_FUNDS="{{ source_of_funds_address }}"'
        state: present
      register: sof_written
      when: has_source_of_funds

    - name: Confirm value written
      ansible.builtin.debug:
        msg: |
          SOURCE_OF_FUNDS written to {{ idcreate_path }}/.env
          Value: {{ source_of_funds_address }}
      when: has_source_of_funds

    - name: Skip when no source_of_funds_address provided
      ansible.builtin.debug:
        msg: "source_of_funds_address not provided — SOURCE_OF_FUNDS left blank. Set it later via: -e 'source_of_funds_address=Rxxx...'"
      when: not has_source_of_funds

    # ── 4. Force-recreate containers to pick up new .env (only if Sof was set) ─
    - name: Force-recreate idcreate containers
      ansible.builtin.shell:
        cmd: "cd {{ idcreate_path }} && docker compose -p {{ compose_project }} up -d --force-recreate"
      changed_when: true
      when: has_source_of_funds
      register: compose_recreate

    # ── 5. Verify containers are Up ──────────────────────────────────────────
    - name: Wait for api container to be running
      ansible.builtin.shell:
        cmd: "docker ps 2>&1 | grep '{{ compose_project }}-api-1' | head -1 || true"
      register: api_check
      changed_when: false
      retries: 10
      delay: 3
      until: api_check.stdout | length > 0
      failed_when: false

    - name: Wait for worker container to be running
      ansible.builtin.shell:
        cmd: "docker ps 2>&1 | grep '{{ compose_project }}-worker-1' | head -1 || true"
      register: worker_check
      changed_when: false
      retries: 10
      delay: 3
      until: worker_check.stdout | length > 0
      failed_when: false

    # ── 6. Summary ────────────────────────────────────────────────────────────
    - name: Display result
      ansible.builtin.debug:
        msg: |
          SOURCE_OF_FUNDS updated and containers restarted:
            .env path       → {{ idcreate_path }}/.env
            SOURCE_OF_FUNDS → {{ source_of_funds_address if has_source_of_funds else '(not set — left blank)' }}
            compose project → {{ compose_project }}
            api container   → {{ compose_project }}-api-1
            worker container → {{ compose_project }}-worker-1
      when: has_source_of_funds

    - name: Display result (no change)
      ansible.builtin.debug:
        msg: |
          No SOURCE_OF_FUNDS provided — nothing changed.
            .env path       → {{ idcreate_path }}/.env
            SOURCE_OF_FUNDS → (not set)
          Set it later with:
            ansible-playbook -i inventory.ini playbooks/44b-idcreate-source-of-funds-vrsc.yml -e 'source_of_funds_address=Rxxx...'
      when: not has_source_of_funds