# Playbook: 66-directus-vrsctest-setup.yml
# Purpose: Create deploy directory, docker-compose.yml, and .env template for Directus on VRSCTEST.
#          Directus is an off-the-shelf Docker image — no custom build needed.
# Run with: ansible-playbook -i inventory.ini playbooks/66-directus-vrsctest-setup.yml
# Idempotent: safe to re-run — skips if target already exists.
# Next: run 67-directus-vrsctest-deploy.yml
---
- name: Setup Directus deployment directory on BWD
  hosts: production
  become: false
  vars:
    directus_path: "/home/{{ ansible_user }}/directus"
    directus_compose_project: "directus"
    directus_image: "directus/directus:latest"
    directus_port: 8055
    postgres_image: "postgres:16-alpine"
    postgres_port: 5432
    postgres_db: "directus"
    postgres_user: "directus"
    directus_network: "net-vrsctest"
    directus_caddy_container: "mains_blue_caddy-caddy-1"

  tasks:
    # ── 1. Check if target already exists ──────────────────────────────────
    - name: Check if Directus deploy directory already exists
      ansible.builtin.stat:
        path: "{{ directus_path }}"
      register: directus_dir_stat

    - name: Report setup plan
      ansible.builtin.debug:
        msg: |
          Target: {{ directus_path }}
          {{ 'Already present — nothing to do.' if directus_dir_stat.stat.exists else 'Will create fresh.' }}

    - name: Skip if already set up
      ansible.builtin.meta: end_play
      when: directus_dir_stat.stat.exists

    # ── 2. Create deploy directory ─────────────────────────────────────────
    - name: Create Directus deploy directory
      ansible.builtin.file:
        path: "{{ directus_path }}"
        state: directory
        mode: '0750'

    # ── 3. Write docker-compose.yml ────────────────────────────────────────
    - name: Write docker-compose.yml
      ansible.builtin.copy:
        dest: "{{ directus_path }}/docker-compose.yml"
        mode: '0640'
        content: |
          name: {{ directus_compose_project }}

          services:
            postgres:
              image: {{ postgres_image }}
              container_name: directus_postgres
              restart: unless-stopped
              volumes:
                - postgres_data:/var/lib/postgresql/data
              environment:
                POSTGRES_DB: {{ postgres_db }}
                POSTGRES_USER: {{ postgres_user }}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U {{ postgres_user }} -d {{ postgres_db }}"]
                interval: 10s
                timeout: 5s
                retries: 5
              networks:
                - internal

            directus:
              image: {{ directus_image }}
              container_name: directus_app
              restart: unless-stopped
              volumes:
                - uploads_data:/directus/uploads
                - extensions_data:/directus/extensions
                - database_data:/directus/database
              environment:
                SECRET: ${DIRECTUS_SECRET}
                DB_CLIENT: "pg"
                DB_HOST: "postgres"
                DB_PORT: "{{ postgres_port }}"
                DB_DATABASE: {{ postgres_db }}
                DB_USER: {{ postgres_user }}
                DB_PASSWORD: ${POSTGRES_PASSWORD}
                ADMIN_EMAIL: ${ADMIN_EMAIL}
                ADMIN_PASSWORD: ${ADMIN_PASSWORD}
                PUBLIC_URL: ${PUBLIC_URL}
              depends_on:
                postgres:
                  condition: service_healthy
              networks:
                - net-vrsctest
                - internal

          volumes:
            postgres_data:
            uploads_data:
            extensions_data:
            database_data:

          networks:
            net-vrsctest:
              external: true
            internal:
              driver: bridge

    # ── 4. Write .env template ─────────────────────────────────────────────
    - name: Write .env template
      ansible.builtin.copy:
        dest: "{{ directus_path }}/.env"
        mode: '0600'
        content: |
          # Directus VRSCTEST — generated by playbook 66
          # Edit these values before running 67-directus-vrsctest-deploy.yml
          POSTGRES_PASSWORD=REPLACEME
          DIRECTUS_SECRET=REPLACEME
          ADMIN_EMAIL=admin@verus.trading
          ADMIN_PASSWORD=REPLACEME
          PUBLIC_URL=http://localhost:{{ directus_port }}

    # ── 5. Summary ─────────────────────────────────────────────────────────
    - name: Display setup result
      ansible.builtin.debug:
        msg: |
          Directus deploy directory created at {{ directus_path }}
          Edit {{ directus_path }}/.env with real values, then run:
            ansible-playbook -i inventory.ini playbooks/67-directus-vrsctest-deploy.yml
