---
# Playbook: 83-github-credentials-install.yml
# Purpose: Install GitHub credentials for the dream-hermes-agent user on BWD so
# git-over-HTTPS operations against github.com authenticate without prompts.
# Idempotent: safe to re-run (overwrites .netrc with the current token).
#
# Token source: provided via extra var `github_token` (never committed).
# Run with:
#   ansible-playbook -i inventory.ini playbooks/83-github-credentials-install.yml \
#     -e "github_token=<PAT>"
# or:
#   ./run-83-github-credentials.sh   (reads token from the local gh config)

- name: Install GitHub credentials for dream-hermes-agent on BWD
  hosts: production
  become: false
  vars:
    gh_user: "dream-hermes-agent"
    gh_host: "github.com"
    gh_home: "/home/dream-hermes-agent"

  tasks:
    - name: Fail if no token provided
      ansible.builtin.fail:
        msg: "github_token extra var is required — pass -e 'github_token=<PAT>'"
      when: github_token is not defined or github_token | length < 20

    - name: Ensure .netrc exists with github.com credentials
      ansible.builtin.copy:
        dest: "{{ gh_home }}/.netrc"
        content: |
          machine {{ gh_host }}
          login {{ gh_user }}
          password {{ github_token }}
        owner: "{{ gh_user }}"
        group: "{{ gh_user }}"
        mode: "0600"
      register: netrc_result

    - name: Ensure git credential helper prefers .netrc (as the target user)
      ansible.builtin.command:
        cmd: "sudo -u {{ gh_user }} git config --global credential.helper netrc"
      register: helper_result
      changed_when: helper_result.rc == 0

    - name: Verify authentication against GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/user"
        headers:
          Authorization: "token {{ github_token }}"
      register: api_check

    - name: Display verified identity
      ansible.builtin.debug:
        msg: "GitHub auth verified as {{ api_check.json.login }} ({{ api_check.json.id }}) on {{ inventory_hostname }}"
      when: api_check.status == 200
