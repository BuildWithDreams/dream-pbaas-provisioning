# Local secrets — DO NOT COMMIT
# Copy of production.yml with real values for BWD
---
target_host: 135.181.136.105
ansible_user: dream-hermes-agent
ansible_ssh_private_key_file: ~/.ssh/dream-hermes-agent_id_25519
ansible_ssh_common_args: -o StrictHostKeyChecking=no
ansible_python_interpreter: /usr/bin/python3
docker_users:
  - dream-hermes-agent
clone_destinations:
  docker_verusd: docker-verusd
# Caddy reverse proxy
caddy_letsencrypt_email: "hermesreport@verus.trading"
caddy_domain: "buildwithdreams.com"

# ── idcreate VRSCTEST ─────────────────────────────────────────────────────────
idcreate_postgres_service_name: "idcreate-postgres"
idcreate_path: "/home/{{ ansible_user }}/svc-idcreate"
compose_project: "dev200_idcreate"
docker_network: "net-vrsctest"
idcreate_bind_ip: "10.200.0.14"
idcreate_api_port: "5003"
provisioning_port: "5055"
postgres_port: "5432"
image_name: "buildwithdreams/svc-idcreate"
image_tag: "local"
postgres_image: "postgres:16-alpine"
postgres_db: "idcreate"
postgres_user: "idcreate"
# VRSCTEST daemon RPC
verusd_vrsc_rpc_host: "10.200.0.11"
verusd_vrsc_rpc_port: "18843"
idcreate_domain: "idcreate.vrsctest.buildwithdreams.com"
native_coin: "VRSCTEST"
health_rpc_daemon: "verusd_vrsc"
verusd_conf_path: "vrsctest/data_dir/vrsctest.conf"

# ── idcreate VRSC mainnet ─────────────────────────────────────────────────────
idcreate_vrsc_postgres_service_name: "idcreate-postgres-vrsc"
idcreate_vrsc_path: "/home/{{ ansible_user }}/svc-idcreate-vrsc"
idcreate_vrsc_compose_project: "mains_blue-vrsc"
idcreate_vrsc_docker_network: "net-vrsc-blue"
idcreate_vrsc_bind_ip: "10.201.0.2"
idcreate_vrsc_api_port: "5003"
idcreate_vrsc_provisioning_port: "5055"
idcreate_vrsc_postgres_port: "5432"
idcreate_vrsc_image_name: "buildwithdreams/svc-idcreate"
idcreate_vrsc_image_tag: "local"
idcreate_vrsc_postgres_image: "postgres:16-alpine"
idcreate_vrsc_postgres_db: "idcreate"
idcreate_vrsc_postgres_user: "idcreate"
idcreate_vrsc_verusd_conf_path: "mainnet/data_dir/VRSC.conf"
# VRSC daemon RPC (dedicated VRSC RPC vars — clean separation from chain-level verusd_*)
idcreate_vrsc_rpc_host: "10.201.0.11"
idcreate_vrsc_rpc_port: "27486"
# VRSC-specific Caddy/domain
idcreate_vrsc_domain: "idcreate.vrsc.buildwithdreams.com"