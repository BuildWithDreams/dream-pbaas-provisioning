[project]
name = "langgraph-provisioning"
version = "0.1.0"
description = "LangGraph orchestration for dream-pbaas-provisioning Ansible playbooks"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0",
]

[project.scripts]
lg-sync-status = "provisioning_langgraph.cli:sync_status_main"
lg-idcreate-deploy = "provisioning_langgraph.cli:idcreate_deploy_main"

[tool.ruff]
line-length = 100
target-version = "py311"